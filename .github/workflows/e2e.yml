name: E2E Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  e2e-tests:
    name: E2E Tests (Mock Mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 缓存 npm 依赖
      - name: Cache node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 缓存 Playwright 浏览器
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Mock Mode with parallelization)
        run: npm run e2e:parallel
        env:
          CI: true
          MOCK_MODE: true

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-results/**/*.png
          retention-days: 7

      # PR 时注释测试结果
      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const junitPath = 'test-results/junit.xml';

            if (fs.existsSync(junitPath)) {
              const junit = fs.readFileSync(junitPath, 'utf8');
              // 简单解析 JUnit XML
              const tests = (junit.match(/tests="/g) || []).length;
              const failures = (junit.match(/failures="/g) || []).length;
              const errors = (junit.match(/errors="/g) || []).length;

              const body = `## 🧪 E2E 测试结果

              - ✅ 总测试数: ${tests}
              - ❌ 失败: ${failures}
              - ⚠️ 错误: ${errors}
              - 📊 详细报告: 请查看 Artifacts 中的 playwright-report
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  e2e-performance-check:
    name: Test Performance Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests with timing
        run: |
          START_TIME=$(date +%s)
          npm run e2e:parallel
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "Test duration: ${DURATION}s"

          # 如果测试时间超过 5 分钟，发出警告（由于并行化，期望更快）
          if [ $DURATION -gt 300 ]; then
            echo "::warning::E2E tests took ${DURATION}s, which is longer than expected (300s)"
          else
            echo "::notice::E2E tests completed in ${DURATION}s (target: <300s)"
          fi
        env:
          MOCK_MODE: true

      - name: Report test metrics
        run: |
          echo "## Test Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Tests completed successfully" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/junit.xml ]; then
            echo "- JUnit report generated" >> $GITHUB_STEP_SUMMARY
          fi
