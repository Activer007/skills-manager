[package]
name = "skill-manager"
version = "1.2.2"
description = "Skill Manager Desktop App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "skill_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
rust-i18n = "3"

[dependencies]
# 国际化
rust-i18n = "3"

# 日志系统
log = "0.4"
env_logger = "0.11"

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "6"
walkdir = "2"
regex = "1"
zip = "2"
fs_extra = "1.3"

# Skill Analyzer dependencies
serde_yaml = "0.9"              # YAML frontmatter parsing
pulldown-cmark = "0.11"         # Markdown parsing
chrono = { version = "0.4", features = ["serde"] }  # Date/time handling

# Security Scanner dependencies
anyhow = "1"                    # Error handling
lazy_static = "1.4"             # Lazy static regex patterns
sha2 = "0.10"                   # Checksum calculation
lru = "0.16.3"
once_cell = "1.21.3"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
uuid = { version = "1.19.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"                  # Temporary files for testing

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
